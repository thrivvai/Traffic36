[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# The site isn't launched yet: keep it out of search results. Remove this block at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-page app: every page route serves index.html. API routes are matched by functions first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
